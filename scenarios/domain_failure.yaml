# Domains failing during operation. The registry declares a domain lost when it misses heartbeats
# (here: 3 x 2 s); services running on it end, and the surviving domain releases its resources.
name: domain_failure
description: A RAN crashes, another stops sending heartbeats; the freed CORE capacity is reused by a later intent.

runtime:
  duration_s: 90

registry:
  heartbeat_interval_s: 2
  max_missed_heartbeats: 3

orchestrator:
  domain_selection: lowest_latency

domains:
  - name: core-1
    type: core
    capabilities: { cpu: 16, memory_gb: 64, storage_gb: 500, maxNumberofUEs: 5000 }
    behavior:
      max_services: 2                # full while intents 0 and 1 run

  - name: ran-a
    type: ran
    capabilities:
      maxNumberofUEs: 500
      nROperatingBands: [n78]
      coverageAreaTAList: [[260, 6, 1000]]
      positioning: true
      core_links: { core-1: 3.0 }
    behavior: { max_bandwidth_mhz: 200 }

  - name: ran-b                       # backup for TA 1000, slower link
    type: ran
    capabilities:
      maxNumberofUEs: 500
      nROperatingBands: [n78]
      coverageAreaTAList: [[260, 6, 1000]]
      positioning: true
      core_links: { core-1: 9.0 }
    behavior: { max_bandwidth_mhz: 200 }

  - name: ran-c
    type: ran
    capabilities:
      maxNumberofUEs: 500
      nROperatingBands: [n78]
      coverageAreaTAList: [[260, 6, 2000]]
      positioning: true
      core_links: { core-1: 5.0 }
    behavior: { max_bandwidth_mhz: 200 }

intents:
  # 0: lowest latency -> ran-a; ran-a crashes at 5 s -> service ends.
  - at_s: 0
    rfs: { ran: { bandwidth_mhz: 50, tac: 1000, duration_s: 60 }, core: { priority: 1 } }
  # 1: ran-c is the only RAN in TA 2000; it stops sending heartbeats at 5 s -> service ends.
  - at_s: 0
    rfs: { ran: { bandwidth_mhz: 50, tac: 2000, duration_s: 60 }, core: { priority: 1 } }
  # 2: ran-a is gone -> ran-b; core-1 accepts only because intents 0 and 1 released their slots.
  - at_s: 18
    rfs: { ran: { bandwidth_mhz: 50, tac: 1000, duration_s: 10 }, core: { priority: 1 } }

events:
  - { at_s: 5, domain: ran-a, action: crash }
  - { at_s: 5, domain: ran-c, action: stop_heartbeat }

expect:
  - { intent: 0, final_state: HANDLING_ENDED, ran: ran-a, message_contains: "ran-a lost heartbeat" }
  - { intent: 1, final_state: HANDLING_ENDED, ran: ran-c, message_contains: "ran-c lost heartbeat" }
  - { intent: 2, final_state: HANDLING_ENDED, ran: ran-b, core: core-1, attempts: 1, message_contains: "lifecycle expired" }
