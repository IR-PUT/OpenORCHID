<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </radialGradient>

    <!-- Petal 1 Fill Gradient (Fuchsia to Red-Orange) -->
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D800A6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FF5252" stop-opacity="0.85" />
    </linearGradient>

    <!-- Petal 2 Fill Gradient (Deep Magenta to Orange) -->
    <linearGradient id="petalGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0.8" />
    </linearGradient>

    <!-- Data Line Stream Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="50%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#9E00FF" />
    </linearGradient>

    <!-- Glow Effect for Core & Nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Mode Background -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>

  <!-- Outer Decorative Ring Grid / Domain Boundary -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#21262D" stroke-width="2" stroke-dasharray="6,6" />

  <!-- GEOMETRIC LAYERED PETALS (ORCHID TOPOLOGY) -->
  <g opacity="0.95">
    <!-- Top Central Petal -->
    <path d="M 250 80 Q 300 150 290 220 Q 250 250 210 220 Q 200 150 250 80 Z" fill="url(#petalGrad1)" stroke="#FF5252" stroke-width="1.5"/>

    <!-- Top Left Petal / Wing -->
    <path d="M 250 250 Q 150 200 85 170 Q 120 270 200 275 Z" fill="url(#petalGrad2)" stroke="#D800A6" stroke-width="1.5"/>

    <!-- Top Right Petal / Wing -->
    <path d="M 250 250 Q 350 200 415 170 Q 380 270 300 275 Z" fill="url(#petalGrad2)" stroke="#D800A6" stroke-width="1.5"/>

    <!-- Bottom Left Sepal -->
    <path d="M 250 250 Q 170 300 130 380 Q 220 380 250 290 Z" fill="url(#petalGrad1)" opacity="0.8" stroke="#FF5252" stroke-width="1.5"/>

    <!-- Bottom Right Sepal -->
    <path d="M 250 250 Q 330 300 370 380 Q 280 380 250 290 Z" fill="url(#petalGrad1)" opacity="0.8" stroke="#FF5252" stroke-width="1.5"/>

    <!-- Central Orchid Lip / Core Structure -->
    <path d="M 250 210 C 210 260 210 320 250 330 C 290 320 290 260 250 210 Z" fill="#FF007A" opacity="0.9" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- OVERLAY DATA FLOW & CIRCUIT TOPOLOGY (Continuous Lines) -->
  <g fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Circuit Routing Loop 1 -->
    <path d="M 85 170 C 130 110, 370 110, 415 170" />
    
    <!-- Circuit Routing Loop 2 -->
    <path d="M 415 170 C 420 290, 320 410, 250 410 C 180 410, 80 290, 85 170" />

    <!-- Inner Orchestration Loop -->
    <path d="M 130 380 C 180 220, 320 220, 370 380" />
    
    <!-- Vertical Cross-Domain Spine -->
    <path d="M 250 80 L 250 410" stroke-dasharray="8,8" stroke-width="2.5"/>
  </g>

  <!-- INTER-DOMAIN NETWORK NODES -->
  <g fill="#FFFFFF" stroke="#D800A6" stroke-width="3" filter="url(#glow)">
    <!-- Main Domain Edge Nodes -->
    <circle cx="250" cy="80" r="9" />
    <circle cx="85" cy="170" r="9" fill="#FF8A00" />
    <circle cx="415" cy="170" r="9" fill="#FF8A00" />
    <circle cx="130" cy="380" r="9" fill="#D800A6" />
    <circle cx="370" cy="380" r="9" fill="#D800A6" />
    <circle cx="250" cy="410" r="9" />

    <!-- Intermediate Circuit Junctions -->
    <circle cx="250" cy="145" r="5" fill="#00F2FE" stroke="none" />
    <circle cx="180" cy="240" r="5" fill="#00F2FE" stroke="none" />
    <circle cx="320" cy="240" r="5" fill="#00F2FE" stroke="none" />
    <circle cx="250" cy="330" r="6" fill="#FF5252" stroke="none" />

    <!-- Central Orchestrator Hub Core -->
    <circle cx="250" cy="250" r="16" fill="#FFFFFF" stroke="#FF007A" stroke-width="4" />
    <circle cx="250" cy="250" r="7" fill="#FF007A" stroke="none" />
  </g>
</svg>
