# Several RAN profiles and two CORE domains. The intents are chosen so that each orchestration
# mechanism shows up in the result: link-latency filtering, capacity accounting in the domains,
# retrying the next (RAN, CORE) candidate, and the CORE service limit.
name: multi_domain
description: URBAN / RURAL / SUBURBAN RAN profiles, central and edge CORE, lowest-latency selection with retries.

runtime:
  duration_s: 90

registry:
  heartbeat_interval_s: 5
  max_missed_heartbeats: 3

orchestrator:
  domain_selection: lowest_latency   # first_available | least_loaded | lowest_latency | random
  max_candidates: 5                  # (RAN, CORE) pairs tried before the intent is rejected

domains:
  - name: core-central
    type: core
    capabilities: { cpu: 64, memory_gb: 256, storage_gb: 2000, maxNumberofUEs: 20000 }

  - name: core-edge
    type: core
    capabilities: { cpu: 16, memory_gb: 64, storage_gb: 500, maxNumberofUEs: 5000 }
    behavior:
      max_services: 2                # small edge site

  - name: ran-urban
    type: ran
    capabilities:
      maxNumberofUEs: 1000
      nROperatingBands: [n78, n258]
      coverageAreaTAList: [[260, 6, 1000], [260, 6, 2000]]
      positioning: true
      core_links: { core-central: 8.0, core-edge: 2.0 }   # link latency [ms]
    behavior:
      max_bandwidth_mhz: 400         # shared by all services on this RAN
      telemetry: { interval_s: 2, throughput_mbps: 90, latency_ms: 8 }

  - name: ran-rural
    type: ran
    capabilities:
      maxNumberofUEs: 200
      nROperatingBands: [n28, n1]
      coverageAreaTAList: [[260, 6, 3000]]
      positioning: false
      core_links: { core-central: 35.0 }
    behavior:
      max_bandwidth_mhz: 40
      telemetry: { interval_s: 2, throughput_mbps: 20, latency_ms: 30 }

  - name: ran-suburban
    type: ran
    capabilities:
      maxNumberofUEs: 500
      nROperatingBands: [n78, n1]
      coverageAreaTAList: [[260, 6, 2000], [260, 6, 4000]]
      positioning: true
      core_links: { core-central: 15.0, core-edge: 6.0 }
    behavior:
      max_bandwidth_mhz: 200
      telemetry: { interval_s: 2, throughput_mbps: 60, latency_ms: 15 }

intents:
  # 0: only ran-urban covers TA 1000 and only core-edge is within 5 ms -> ran-urban + core-edge.
  - at_s: 0
    owner: factory-operator
    expression: Low-latency slice for robots in TA 1000 for 20 seconds, 100 MHz, latency under 10 ms.

  # 1: no RAN in TA 2000 has 1000 MHz -> all 4 candidates reject -> REJECTED (with proposals).
  - at_s: 2
    owner: video-streaming
    rfs:
      ran: { bandwidth_mhz: 1000, tac: 2000, duration_s: 15 }
      core: { priority: 3 }

  # 2: fits on ran-urban + core-edge (core-edge is now full), but telemetry (90 Mbps) is below target -> SLA degraded.
  - at_s: 4
    owner: stadium-event
    rfs:
      ran: { bandwidth_mhz: 200, throughput_mbps: 150, tac: 1000, duration_s: 20 }
      core: { priority: 1, latency_ms: 20 }

  # 3: ran-urban has only 100 MHz left, core-edge is full -> accepted on the 4th candidate: ran-suburban + core-central.
  - at_s: 8
    owner: campus-network
    rfs:
      ran: { bandwidth_mhz: 150, num_ues: 300, tac: 2000, duration_s: 15 }
      core: { priority: 2 }

  # 4: ran-rural (TA 3000) reaches only core-central over a 35 ms link -> no candidate within 20 ms -> REJECTED.
  - at_s: 10
    owner: agriculture
    rfs:
      ran: { bandwidth_mhz: 20, tac: 3000, duration_s: 15 }
      core: { latency_ms: 20 }

  # 5: the mock LLM does not know this sentence -> translation fails -> SUBMISSION_FAILED.
  - at_s: 12
    owner: unknown-user
    expression: Something the mock LLM does not know.

expect:
  - { intent: 0, final_state: HANDLING_ENDED, ran: ran-urban, core: core-edge, attempts: 1, sla_degraded: false }
  - { intent: 1, final_state: REJECTED, attempts: 4, message_contains: "1000 MHz requested" }
  - { intent: 2, final_state: HANDLING_ENDED, ran: ran-urban, core: core-edge, sla_degraded: true }
  - { intent: 3, final_state: HANDLING_ENDED, ran: ran-suburban, core: core-central, attempts: 4 }
  - { intent: 4, final_state: REJECTED, attempts: 0, message_contains: "No UP RAN/CORE pair" }
  - { intent: 5, final_state: SUBMISSION_FAILED }

translations:
  "Low-latency slice for robots in TA 1000 for 20 seconds, 100 MHz, latency under 10 ms.":
    ran: { bandwidth_mhz: 100, latency_ms: 10, tac: 1000, duration_s: 20 }
    core: { priority: 1, latency_ms: 5 }
