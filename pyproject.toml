[project]
name = "openorchid"
version = "0.1.0"
description = "Event-driven inter-domain orchestration (IDMO) demo with configurable YAML scenarios"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.1",
    "aiokafka>=0.14.0",
    "fastapi>=0.139.0",
    "loguru>=0.7.3",
    "nats-py>=2.15.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "scenario: runs a whole scenario file in mock mode (slow, ~30 s each)",
    "real_infra: runs scenarios against docker-compose services, needs OPENORCHID_REAL=kafka,nats",
]
